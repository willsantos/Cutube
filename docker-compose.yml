services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: cutube-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cutube}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-cutube123}
      RABBITMQ_DEFAULT_VHOST: "/"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cutube-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Cutube.Api/Dockerfile
    container_name: cutube-api
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER:-cutube}
      RabbitMq__Password: ${RABBITMQ_PASS:-cutube123}
      RabbitMq__VirtualHost: "/"
      SignalR__Enabled: "true"
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft_AspNetCore: Warning
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - downloads-data:/app/downloads
      - ./logs/api:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cutube-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/Cutube.Worker/Dockerfile
    container_name: cutube-worker
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER:-cutube}
      RabbitMq__Password: ${RABBITMQ_PASS:-cutube123}
      RabbitMq__VirtualHost: "/"
      Worker__MaxConcurrentDownloads: ${MAX_CONCURRENT:-3}
      Worker__ApiBaseUrl: http://api:8080
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Cutube: Debug
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - downloads-data:/downloads
      - ./logs/worker:/app/logs
    networks:
      - cutube-network
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  web:
    build:
      context: ./cutube-web
      dockerfile: Dockerfile
    container_name: cutube-web
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      NEXT_PUBLIC_SIGNALR_URL: ${NEXT_PUBLIC_SIGNALR_URL:-http://localhost:5000/hubs/downloads}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cutube-network
    restart: unless-stopped

volumes:
  rabbitmq-data:
    driver: local
  downloads-data:
    driver: local

networks:
  cutube-network:
    driver: bridge
